<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="description" content="Lutté — Note" />
    <title>Note — Lutté</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/Manrope.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="assets/fonts/PretendardVariable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="note.css" />
    <script src="note.js" defer></script>
    <script src="motion.js" defer></script>
  </head>
  <body id="top" class="note-page">
    <a class="skip" href="#content">본문으로</a>
    <div class="progress" aria-hidden="true"></div>
    <header class="header">
      <a class="logo" href="index.html">lutté<span class="brand-dot">.</span></a>
      <nav aria-label="주요 메뉴">
        <a href="index.html#projects">Projects</a><a href="note.html" aria-current="page">Note</a><a href="clone.html">Cloné</a><a href="https://github.com/luttechan" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </nav>
    </header>
    <main id="content" class="note-main">
      <section id="note-list" aria-labelledby="note-heading">
        <div class="note-heading">
          <span class="eyebrow">LUTTÉ</span>
          <h1 id="note-heading">Note<span>.</span></h1>
        </div>
        <p id="note-status" class="note-status" role="status">불러오는 중…</p>
        <ol id="notes" class="notes"></ol>
      </section>
      <article id="note-detail" hidden aria-labelledby="note-title">
        <a class="note-back" href="note.html">← Note</a>
        <header class="note-article-heading">
          <time id="note-date"></time>
          <h1 id="note-title"></h1>
        </header>
        <div id="note-body" class="note-body"></div>
        <a class="note-back note-end" href="note.html">← 목록으로</a>
      </article>
      <noscript><p class="note-status">Note를 보려면 JavaScript를 켜주세요.</p></noscript>
    </main>
    <footer><span>© <span id="year">2026</span> Lutté</span><a href="#top">맨 위로 ↑</a></footer>
  </body>
</html>
