    <nav class="frame masthead" aria-label="주 메뉴">
      <a class="mark" href="../"><img src="../assets/calix.svg" width="29" height="29" alt="">Calix</a>
      <div class="nav-links">

        <a href="../vesper/">Vesper</a>
        <a href="../guide/">사용 설명서</a>
      </div>
    </nav>
  </header>
  <main id="main">
    <section class="aurora-hero" id="download" aria-labelledby="aurora-title">
      <div class="aurora-light" aria-hidden="true"></div>
      <div class="frame hero-content">
        <h1 id="aurora-title">Calix <span>Aurora</span></h1>
        <p>부산외대 Canvas 일정 관리</p>
        <a class="button" href="https://github.com/luttechan/Calix/releases/download/v1.8.0/Calix-1.8.0-Setup-x64.exe">Windows 다운로드</a>
        <small>Windows 10 / 11, x64, 1.8.0</small>
        <div class="hero-screen">
          <img src="../assets/aurora-home.webp?v=177" width="1440" height="960" alt="Calix Aurora 홈에 표시된 오늘의 과제와 영상 일정" fetchpriority="high" decoding="async">
        </div>
      </div>
    </section>

    <div class="frame aurora-content">
      <aside class="contest" aria-label="공모전 출품">
        <span class="contest-laurel" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <div><strong>부산외국어대학교</strong><span>2026 대학혁신을 위한 아이디어 공모전 출품작</span></div>
        <span class="contest-laurel contest-laurel--right" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      </aside>
      <div class="features">
        <section class="feature" id="calendar" aria-labelledby="calendar-title">
          <div class="section-heading"><h2 id="calendar-title">달력</h2><a href="../guide/#event-filters">일정 필터</a></div>
          <div class="feature-screen"><img src="../assets/calendar-173.webp" width="1440" height="842" alt="마감일과 일정 유형을 표시한 달력" loading="lazy" decoding="async"></div>
        </section>
        <section class="feature" id="timetable" aria-labelledby="timetable-title">
          <div class="section-heading"><h2 id="timetable-title">시간표</h2><a href="../guide/#timetable-edit">수업 편집</a></div>
          <div class="feature-screen"><img src="../assets/timetable.webp" width="1440" height="960" alt="강의실과 남은 과제 건수를 표시한 시간표" loading="lazy" decoding="async"></div>
        </section>
      </div>
      <section class="theme-panel" id="themes" aria-labelledby="theme-title">
        <div class="theme-header">
          <h2 id="theme-title">테마</h2>
          <div class="theme-groups">
            <div class="theme-group">
              <p id="theme-aurora-family">Aurora</p>
              <div class="theme-picker" role="group" aria-labelledby="theme-aurora-family">
                <button type="button" data-image="aurora-home.webp" style="--swatch:linear-gradient(150deg,#79dbca,#182e4a)" aria-pressed="true" title="오로라" aria-label="오로라"></button>
                <button type="button" data-image="aurora-dawn-177.webp" style="--swatch:linear-gradient(150deg,#c0e5f0,#aaa2dc)" aria-pressed="false" title="새벽" aria-label="새벽"></button>
                <button type="button" data-image="aurora-dusk-177.webp" style="--swatch:linear-gradient(150deg,#c2a3f0,#432f6c)" aria-pressed="false" title="황혼" aria-label="황혼"></button>
              </div>
            </div>
            <div class="theme-group">
              <p id="theme-legacy-family">Pre-Aurora</p>
              <div class="theme-picker" role="group" aria-labelledby="theme-legacy-family">
                <button type="button" data-theme="pink" style="--swatch:#d09bb7" aria-pressed="false" title="핑크" aria-label="핑크"></button>
                <button type="button" data-theme="sky" style="--swatch:#9bb8db" aria-pressed="false" title="스카이블루" aria-label="스카이블루"></button>
                <button type="button" data-theme="mint" style="--swatch:#9bcdb9" aria-pressed="false" title="민트" aria-label="민트"></button>
                <button type="button" data-theme="purple" style="--swatch:#b7a0d4" aria-pressed="false" title="퍼플" aria-label="퍼플"></button>
                <button type="button" data-theme="dark" style="--swatch:#333242" aria-pressed="false" title="다크" aria-label="다크"></button>
                <button type="button" data-theme="peach" style="--swatch:#deaa92" aria-pressed="false" title="피치" aria-label="피치"></button>
                <button type="button" data-theme="amber" style="--swatch:#d7b16a" aria-pressed="false" title="앰버" aria-label="앰버"></button>
                <button type="button" data-theme="olive" style="--swatch:#a7b580" aria-pressed="false" title="올리브" aria-label="올리브"></button>
                <button type="button" data-theme="lavender" style="--swatch:#aaa7dc" aria-pressed="false" title="라벤더" aria-label="라벤더"></button>
              </div>
            </div>
          </div>
        </div>
        <div class="theme-screen"><img id="theme-preview" src="../assets/aurora-home.webp?v=177" width="1440" height="960" alt="Calix 오로라 테마" loading="lazy" decoding="async"></div>
      </section>
