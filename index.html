<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0b0b0c" />
    <meta
      name="description"
      content="Lutté"
    />
    <title>Lutté — Projects</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preload" href="assets/fonts/Manrope.ttf" as="font" type="font/ttf" crossorigin />
    <link
      rel="preload"
      href="assets/fonts/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js" defer></script>

  <body id="top">
    <a class="skip" href="#content">본문으로</a>
    <div class="progress" aria-hidden="true"></div>
    <header class="header">
      <a class="logo" href="index.html">lutté<span class="brand-dot">.</span></a>
      <nav aria-label="주요 메뉴">
        <a href="index.html#projects">Projects</a><a href="clone.html">Cloné</a
        ><a href="https://github.com/luttechan" target="_blank" rel="noopener noreferrer"
          >GitHub ↗</a
        >
      </nav>
    </header>
    <main id="content">
      <section class="hero">
        <div class="eyebrow hero-label"><span class="status-dot"></span> DEVELOPER & CREATOR</div>
        <h1>Lutté<span class="name-dot">.</span></h1>
        <p class="hero-subtitle">교육 자료의 보편화를 위하여</p>
        <div class="hero-bottom">
          <p>언어 학습에 필요한 도구를 만듭니다.</p>
          <a class="inline-link" href="#projects">프로젝트 보기 <span>↓</span></a>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="orbital orbital-one"></div>
          <div class="orbital orbital-two"></div>
          <div class="orbital orbital-three"></div>
          <div class="art-center">&lt; / &gt;</div>
          <span class="art-caption">PYTHON · LANGUAGE · TOOLS</span>
        </div>
      </section>
      <section id="projects" class="section">
        <div class="section-head reveal">
          <h2>Projects<span class="heading-dot"> /</span></h2>
          <span class="eyebrow">PUBLIC REPOSITORIES</span>
        </div>
        <div class="toolbar">
          <div class="filters" role="group" aria-label="프로젝트 분류">
            <button class="active" data-filter="all" aria-pressed="true">
              전체 <span id="total">4</span></button
            ><button data-filter="language" aria-pressed="false">언어·학습</button
            ><button data-filter="utility" aria-pressed="false">유틸리티</button
            ><button data-filter="web" aria-pressed="false">웹</button>
          </div>
          <label class="search"
            ><input id="search" type="search" placeholder="검색" aria-label="프로젝트 검색" /><span
              aria-hidden="true"
              >⌕</span
            ></label
          >
        </div>
        <p id="result-status" class="sr-only" role="status"></p>
        <div id="project-grid" class="project-grid"></div>
        <noscript
          ><a href="https://github.com/luttechan?tab=repositories"
            >GitHub에서 프로젝트 보기</a
          ></noscript
        >
        <div class="collection-foot">
          <span id="sync-status">공개 저장소</span
          ><a href="https://github.com/luttechan?tab=repositories">전체 저장소 ↗</a>
        </div>
      </section>
      <section class="profile section reveal">
        <h2>Lutté</h2>
        <div>
          <p>Python으로 언어 학습 도구를 만듭니다.</p>
          <a href="https://github.com/luttechan">@luttechan ↗</a>
        </div>

      <a class="character-link reveal" href="clone.html"
        ><div>
          <span class="eyebrow">ORIGINAL CHARACTER</span>
          <h2>Cloné</h2>
          <p>클로네 로랑 설정집</p>
        </div>
        <span class="link-arrow" aria-hidden="true">↗</span></a
      >

    <footer>
      <span>© <span id="year">2026</span> Lutté</span><a href="#top">위로 ↑</a>
